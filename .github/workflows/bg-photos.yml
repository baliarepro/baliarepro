# Unduh foto latar alam Bali (Wikimedia Commons) → img/bg/. Manual: Actions → "Foto latar".
name: Foto latar

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "candidates (kandidat untuk dipilih) atau final"
        default: "candidates"

permissions:
  contents: write

jobs:
  bg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - run: python tools/bg-photos.py "${{ inputs.mode }}"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ "${{ inputs.mode }}" = final ] && git rm -rq --ignore-unmatch img/bg/raw
          git add -A img/bg
          git diff --cached --quiet && exit 0
          git commit -m "Foto latar alam Bali (Wikimedia Commons)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
