# Laporan mingguan jumlah dilihat per iklan (tools/views-report.js) → laporan-dilihat.json.
# Tiap Senin ±07.17 WITA (sebelum tugas harian Claude membaca laporan). Bisa juga dijalankan manual.
name: Laporan dilihat

on:
  schedule:
    - cron: "17 23 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ambil angka dilihat
        run: node tools/views-report.js
      - name: Simpan laporan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add laporan-dilihat.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Laporan dilihat mingguan"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
