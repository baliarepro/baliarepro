# Carousel Instagram mingguan (Senin ±16.07 WITA). Lihat tools/ig-weekly.js.
# Ada berita baru 7 hari terakhir → "Berita Properti Bali Minggu Ini"; tidak ada → 1 topik edukasi aturan properti.
name: Instagram mingguan

on:
  schedule:
    - cron: "7 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: instagram-weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pasang Playwright + Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Buat gambar carousel
        run: node tools/ig-weekly.js render
      - name: Commit gambar & picu GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/ig-weekly
          if git diff --cached --quiet; then echo "Tidak ada gambar baru"; exit 0; fi
          git commit -m "Instagram mingguan: gambar carousel"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
      - name: Posting ke Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node tools/ig-weekly.js post
      - name: Simpan status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ig-weekly-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Instagram mingguan: perbarui status"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
