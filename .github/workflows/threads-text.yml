# Posting teks harian Threads (tools/threads-text.js): 1 posting per hari ±20.07 WITA dari tools/threads-text-content.js.
# Kategori bergilir: personal branding, calon buyer, owner yang ingin menjual, diskusi, edukasi, tips.
# Butuh secret THREADS_TOKEN. Status di tools/threads-text-state.json.
name: Threads teks harian

on:
  schedule:
    - cron: "7 12 * * *"
  workflow_dispatch:
    inputs:
      id:
        description: "ID posting tertentu (kosong = berikutnya)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: threads-text
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Posting teks ke Threads
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: |
          if [ -n "${{ inputs.id }}" ]; then node tools/threads-text.js post --id=${{ inputs.id }}; else node tools/threads-text.js post; fi
      - name: Simpan status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/threads-text-state.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Threads teks: perbarui status"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
