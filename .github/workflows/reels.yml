# Reels Instagram otomatis dari foto listing (tools/ig-reels.js): 1 Reel per hari ±19.07 WITA.
# Video dibuat di sini (Playwright + ffmpeg) lalu diunggah langsung ke Instagram; tidak disimpan di repo.
# Butuh secret IG_TOKEN (+ IG_USER_ID) yang sama dengan posting carousel. Status di tools/reels-state.json.
name: Instagram Reels

on:
  schedule:
    - cron: "7 11 * * *"
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug listing tertentu (kosong = otomatis pilih berikutnya)"
        required: false
        default: ""
      tiktok_only:
        description: "Hanya kirim ke draft TikTok (tanpa posting Instagram)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pasang Playwright, Chromium, ffmpeg
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          # Mirror Ubuntu kadang lambat/putus (gagal 19 Nov 2026): coba ulang sampai 3x.
          if ! which ffmpeg; then
            for i in 1 2 3; do
              sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y --fix-missing ffmpeg && break
              echo "Pemasangan ffmpeg gagal (percobaan $i), coba lagi..."; sleep 20
            done
            which ffmpeg
          fi
      - name: Buat & posting Reel
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          REEL_KEEP: /tmp/reel-out
          TIKTOK_ONLY: ${{ inputs.tiktok_only && '1' || '' }}
        run: |
          if [ -n "${{ inputs.slug }}" ]; then node tools/ig-reels.js post --slug=${{ inputs.slug }}; else node tools/ig-reels.js post; fi
      - name: Kirim ke draft TikTok
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: node tools/tiktok-post.js post --dir=/tmp/reel-out || true
      - name: Simpan status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/reels-state.json tools/tiktok-state.json 2>/dev/null || git add tools/reels-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reels: perbarui status posting"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
