# Reels Instagram otomatis dari foto listing (tools/ig-reels.js): 1 Reel per hari ±19.07 WITA (juga dikirim ke draft TikTok).
# Jadwal ke-2 ±11.37 WITA (10.37 WIB): hanya draft TikTok (listing lain), untuk diposting pemilik ±11.30–12.30 WIB.
# Reel malam juga diunggah ke Facebook Reels (tools/fb-reels.js). Jadwal ±13.07 & ±16.37 WITA: Facebook Reels susulan
# (FB_BACKLOG) untuk listing yang Reel IG-nya sudah tayang sebelumnya — 1 per jadwal sampai semua masuk Facebook.
# Video dibuat di sini (Playwright + ffmpeg) lalu diunggah langsung ke Instagram; tidak disimpan di repo.
# Butuh secret IG_TOKEN (+ IG_USER_ID) yang sama dengan posting carousel. Status di tools/reels-state.json.
name: Instagram Reels

on:
  schedule:
    - cron: "7 11 * * *"
    - cron: "37 3 * * *"
    - cron: "7 5 * * *"
    - cron: "37 8 * * *"
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug listing tertentu (kosong = otomatis pilih berikutnya)"
        required: false
        default: ""
      tiktok_only:
        description: "Hanya kirim ke draft TikTok (tanpa posting Instagram)"
        type: boolean
        required: false
        default: false
      fb_backlog:
        description: "Facebook Reels susulan (Reel IG lama yang belum ada di Facebook)"
        type: boolean
        required: false
        default: false
      no_tiktok:
        description: "Jangan kirim draft TikTok (mis. TikTok lewat antrean tools/tiktok-queue.json)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pasang Playwright, Chromium, ffmpeg
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          # Mirror Ubuntu kadang lambat/putus (gagal 19 Nov 2026): coba ulang sampai 3x.
          if ! which ffmpeg; then
            for i in 1 2 3; do
              sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y --fix-missing ffmpeg && break
              echo "Pemasangan ffmpeg gagal (percobaan $i), coba lagi..."; sleep 20
            done
            which ffmpeg
          fi
      - name: Buat & posting Reel
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          REEL_KEEP: /tmp/reel-out
          TIKTOK_ONLY: ${{ (inputs.tiktok_only || github.event.schedule == '37 3 * * *') && '1' || '' }}
          NO_TIKTOK: ${{ inputs.no_tiktok && '1' || '' }}
          FB_BACKLOG: ${{ (inputs.fb_backlog || github.event.schedule == '7 5 * * *' || github.event.schedule == '37 8 * * *') && '1' || '' }}
        run: |
          if [ -n "${{ inputs.slug }}" ]; then node tools/ig-reels.js post --slug=${{ inputs.slug }}; else node tools/ig-reels.js post; fi
      - name: Kirim ke draft TikTok
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: node tools/tiktok-post.js post --dir=/tmp/reel-out || true
      - name: Simpan video TikTok (unggah manual)
        # Selama aplikasi TikTok masih sandbox, draft inbox tidak sampai ke HP pemilik (27 Nov 2026):
        # simpan video + caption di img/tiktok/ (4 terbaru) supaya bisa diunduh & diunggah manual.
        run: |
          [ -f /tmp/reel-out/reel.json ] || exit 0
          node -e 'const m=require("/tmp/reel-out/reel.json");if(m.noTiktok)process.exit(1);require("fs").writeFileSync("/tmp/reel-out/slug",m.slug);require("fs").writeFileSync("/tmp/reel-out/cap.txt",m.caption)' || exit 0
          S=$(cat /tmp/reel-out/slug); mkdir -p img/tiktok
          cp /tmp/reel-out/reel.mp4 "img/tiktok/$S.mp4"; cp /tmp/reel-out/cap.txt "img/tiktok/$S.txt"
          ls -t img/tiktok/*.mp4 | tail -n +5 | while read f; do rm -f "$f" "${f%.mp4}.txt"; done
      - name: Kirim ke Facebook Reels
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node tools/fb-reels.js post --dir=/tmp/reel-out || true
      - name: Simpan status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in tools/reels-state.json tools/tiktok-state.json tools/fb-reels-state.json; do [ -f "$f" ] && git add "$f"; done
          git add -A img/tiktok 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reels: perbarui status posting"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
