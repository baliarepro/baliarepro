# Posting otomatis listing ke Instagram (carousel). Lihat tools/ig-post.js.
# - Setelah "Build website" selesai: listing BARU langsung diposting.
# - 3x sehari (±08.07, 12.07, 17.07 WITA): 1 listing lama dari antrean + listing baru yang tertinggal.
# Setelah itu yang sudah tayang di IG disalin ke Threads (tools/threads-post.js) dan Facebook Page (tools/fb-post.js).
# Butuh secret repo IG_TOKEN (token Instagram long-lived). Tanpa secret, workflow ini tidak melakukan apa-apa.
name: Instagram

on:
  schedule:
    - cron: "7 0 * * *"
    - cron: "7 4 * * *"
    - cron: "7 9 * * *"
  workflow_run:
    workflows: ["Build website"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: "new = hanya listing baru, queue = + 1 listing lama dari antrean"
        default: new
        type: choice
        options: [new, queue]

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  post:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Posting ke Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          MODE="new"
          if [ "${{ github.event_name }}" = "schedule" ]; then MODE="queue"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ inputs.mode }}"; fi
          node tools/ig-post.js --mode=$MODE
      - name: Posting ke Threads
        if: always()
        continue-on-error: true
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: node tools/threads-post.js
      - name: Posting ke Facebook Page
        if: always()
        continue-on-error: true
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node tools/fb-post.js
      - name: Simpan status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ig-state.json tools/threads-state.json tools/fb-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Instagram: perbarui status posting"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
