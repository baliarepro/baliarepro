# Hubungkan akun TikTok pemilik (sekali, atau bila token kedaluwarsa ±1 tahun): buka baliareproperty.com/tiktok.html → Login TikTok →
# salin kode → Actions → "TikTok: hubungkan akun" → Run workflow → tempel kode (berlaku beberapa menit, sekali pakai).
# Butuh secret TIKTOK_CLIENT_KEY + TIKTOK_CLIENT_SECRET. Token disimpan terenkripsi di tools/tiktok-state.json.
name: "TikTok: hubungkan akun"

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Kode dari halaman baliareproperty.com/tiktok.html"
        required: true

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tukar kode jadi token
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_CODE: ${{ inputs.code }}
        run: |
          echo "::add-mask::$TIKTOK_CODE"
          node tools/tiktok-post.js auth
      - name: Simpan status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/tiktok-state.json 2>/dev/null || exit 0
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "TikTok: akun terhubung"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
